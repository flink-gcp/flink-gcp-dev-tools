#
# The non-packaged root tests the shared Python tools, the installation recipes and the example site.
# The tools use only the standard library; consumers keep their own pyproject.toml and uv.lock.

[project]
name = "flink-gcp-dev-tools"
version = "0.0.0"
# flink-connector-gcp's declared requires-python floor; `just test-scripts` also tests it.
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
# Use the Python versions that mise.toml provides instead of uv-managed or downloaded ones.
python-preference = "only-system"
python-downloads = "never"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
# tests/site checks the example site output, so `just docs` runs it after the build.
testpaths = ["scripts/tests", "tests/install"]
